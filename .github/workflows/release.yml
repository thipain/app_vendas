# Gera o APK assinado (Android) e o instalador (Windows) e publica os dois
# numa Release do GitHub sempre que uma tag no formato v1.2.3 é enviada.
# A versão do app é tirada da própria tag.
name: Release Android

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versão a partir da tag
        run: echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure os secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD (veja o README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          if ! keytool -list -keystore android/app/upload-keystore.jks \
               -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD ou KEY_ALIAS não conferem com o keystore. Verifique os secrets."
            exit 1
          fi
          if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD deve ser igual a KEYSTORE_PASSWORD (keystore PKCS12)."
            exit 1
          fi

      - run: flutter pub get
      - run: flutter test

      - name: Build do APK
        run: |
          set -o pipefail
          if ! flutter build apk --release \
              --build-name="$VERSAO" \
              --build-number="${{ github.run_number }}" 2>&1 | tee build.log; then
            # Publica as linhas de erro como anotação, visível no resumo da execução.
            grep -iE "what went wrong|error|exception|failed|incorrect|cannot" build.log \
              | grep -v "^\s*at " | tail -n 40 > erros.txt || true
            echo "::error title=Falha no build do APK::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' erros.txt)"
            exit 1
          fi
          mv build/app/outputs/flutter-apk/app-release.apk "app_vendas-$VERSAO.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app_vendas-${{ env.VERSAO }}.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versão a partir da tag
        shell: bash
        run: echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build do Windows
        run: flutter build windows --release --build-name="$env:VERSAO" --build-number="${{ github.run_number }}"

      - name: Instalador
        run: |
          # Leva junto o runtime do Visual C++, que o app precisa para abrir
          # em computadores que não o têm instalado.
          $destino = "build/windows/x64/runner/Release"
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR/System32/$dll" $destino
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$env:VERSAO installer/app_vendas.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/app_vendas-setup-${{ env.VERSAO }}.exe

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            *.exe
          generate_release_notes: true
